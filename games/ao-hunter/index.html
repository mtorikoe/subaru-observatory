<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Adaptive Optics Star Hunting — Subaru Observatory</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>

<!-- REWARD OVERLAY -->
<div id="reward-overlay"></div>

<div class="shell">

  <!-- NAV -->
  <nav>
    <div class="nav-logo">Subaru Observatory · <span>Adaptive Optics Star Hunting</span></div>
    <span id="stage-label">Stage 1</span>
    <div class="nav-right">
      <button class="nav-btn" onclick="window.location.href='../../index.html'">Home</button>
      <button class="nav-btn" onclick="if(confirm('Reset all progress?')){resetProgress();location.reload();}">Reset</button>
    </div>
  </nav>

  <!-- UPPER ROW: star field | star view | pallet
       instruction bar is OUTSIDE this row so it never stretches -->
  <div class="upper-row">

    <!-- Star field -->
    <div id="sf-wrap">
      <canvas id="sf-canvas"></canvas>
    </div>

    <div class="v-divider" id="div-sf-sv"></div>

    <!-- Current targeted star view — buttons live inside here -->
    <div id="sv-wrap" style="display:none;">
      <canvas id="sv-canvas"></canvas>
      <!-- Buttons overlaid on top of the star view canvas -->
      <div id="sv-buttons">
        <button id="observe-btn" onclick="triggerObservation()">▶ Observe</button>
        <button id="no-planet-btn" onclick="confirmNoPlanet()" style="display:none;">
          ✕ No exoplanet visible
        </button>
      </div>
    </div>

    <div class="v-divider" id="div-sv-pallet"></div>

    <!-- Instrument order pallet -->
    <div id="pallet-col">
      <div class="pallet-label">Build order</div>
      <div class="pallet-empty">Choose instruments below</div>
    </div>

  </div><!-- end upper-row -->

  <!-- INSTRUCTION BAR — fixed auto height, never stretches.
       Drag this bar to resize upper vs lower split. -->
  <div id="instruction-bar">Choose a star from the field on the left.</div>

  <!-- LOWER ROW: carousel | construction -->
  <div class="lower-row">

    <!-- Instrument carousel -->
    <div class="carousel-wrap">
      <div class="carousel-header">Instruments — click to add · click again to remove</div>
      <div class="carousel-body">
        <button class="carousel-arrow" id="carousel-left" onclick="carouselLeft()">‹</button>
        <div id="carousel-rail"></div>
        <button class="carousel-arrow" id="carousel-right" onclick="carouselRight()">›</button>
      </div>
    </div>

    <div class="v-divider" id="div-carousel-construct"></div>

    <!-- Construction / assembled telescope view -->
    <div class="construction-wrap">
      <div class="construction-header">Assembled telescope</div>
      <canvas id="construction-canvas"></canvas>
    </div>

  </div>

</div><!-- end shell -->

<!-- Result banner — sits outside the layout so it never affects heights -->
<div id="result-banner"></div>

<!-- Hidden demo input — revealed by pressing Shift+D twice -->
<input id="demo-code-input" type="text" placeholder="demo code…" autocomplete="off" spellcheck="false">

<script>
// Demo input reveal
let _dk=0;
document.addEventListener('keydown',e=>{
  if(e.shiftKey&&e.key==='D'){ _dk++;
    if(_dk>=2){ _dk=0;
      const inp=document.getElementById('demo-code-input');
      inp.classList.toggle('visible');
      if(inp.classList.contains('visible')) inp.focus();
    }
  } else { _dk=0; }
});
</script>

<!-- Scripts in dependency order -->
<script src="js/data-instruments.js"></script>
<script src="js/data-stars.js"></script>
<script src="js/state.js"></script>
<script src="js/starfield.js"></script>
<script src="js/starview.js"></script>
<script src="js/instruments.js"></script>
<script src="js/game.js"></script>

<script>
/* ── Drag resize ── */
(function(){
  function hDrag(el, getW, setW, min){
    if(!el) return;
    let down=false, x0=0, w0=0;
    el.addEventListener('mousedown', e=>{
      down=true; x0=e.clientX; w0=getW();
      el.classList.add('dragging');
      document.body.style.cssText='cursor:col-resize;user-select:none';
      e.preventDefault();
    });
    window.addEventListener('mousemove', e=>{
      if(!down) return;
      setW(Math.max(min, w0+(e.clientX-x0)));
    });
    window.addEventListener('mouseup', ()=>{
      if(!down) return; down=false;
      el.classList.remove('dragging');
      document.body.style.cssText='';
    });
  }

  function vDrag(el, getH, setH, minUp, minDn){
    if(!el) return;
    let down=false, y0=0, h0=0;
    el.addEventListener('mousedown', e=>{
      // Only start drag on the bar itself, not on text clicks
      down=true; y0=e.clientY; h0=getH();
      el.classList.add('dragging');
      document.body.style.cssText='cursor:row-resize;user-select:none';
      e.preventDefault();
    });
    window.addEventListener('mousemove', e=>{
      if(!down) return;
      const nav   = document.querySelector('nav').offsetHeight;
      const instr = document.getElementById('instruction-bar').offsetHeight;
      const total = document.querySelector('.shell').offsetHeight;
      const maxH  = total - nav - instr - minDn - 10;
      setH(Math.min(maxH, Math.max(minUp, h0+(e.clientY-y0))));
    });
    window.addEventListener('mouseup', ()=>{
      if(!down) return; down=false;
      el.classList.remove('dragging');
      document.body.style.cssText='';
    });
  }

  const sfWrap  = document.getElementById('sf-wrap');
  const svWrap  = document.getElementById('sv-wrap');
  const pCol    = document.getElementById('pallet-col');
  const upper   = document.querySelector('.upper-row');
  const carWrap = document.querySelector('.carousel-wrap');
  const conWrap = document.querySelector('.construction-wrap');
  const instrBar= document.getElementById('instruction-bar');

  hDrag(document.getElementById('div-sf-sv'),
    ()=>sfWrap.offsetWidth,
    w=>{ sfWrap.style.flex='none'; sfWrap.style.width=w+'px'; }, 100);

  hDrag(document.getElementById('div-sv-pallet'),
    ()=>svWrap.offsetWidth,
    w=>{ svWrap.style.flex='none'; svWrap.style.width=w+'px'; }, 80);

  // Instruction bar itself is the resize handle for upper/lower split
  vDrag(instrBar,
    ()=>upper.offsetHeight,
    h=>{ upper.style.flex='none'; upper.style.height=h+'px'; }, 80, 80);

  hDrag(document.getElementById('div-carousel-construct'),
    ()=>carWrap.offsetWidth,
    w=>{ carWrap.style.flex='none'; carWrap.style.width=w+'px'; }, 120);
})();
</script>
</body>
</html>
